
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-ticket-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=0

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: support-ticket-ui
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:5000
